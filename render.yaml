services:
  - type: web
    name: neb-tawy-website
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn divination_site.wsgi --log-file -
    envVars:
      - key: ALLOWED_HOSTS
        value: "*"
      - key: STATIC_ROOT
        value: "/opt/render/project/src/staticfiles"
# Notes:
# - Do not commit secrets here; add SECRET_KEY, STRIPE_*, EMAIL_* in the Render dashboard.
# - The persistent disk at /data keeps the sqlite DB and collected static files between deploys.
