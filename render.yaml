services:
  - type: web
    name: neb-tawy-website
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    releaseCommand: python manage.py migrate --noinput
    startCommand: gunicorn divination_site.wsgi --log-file -
    disk:
      name: sqlite-disk
      path: /data
      size_gb: 1
    envVars:
      - key: DATABASE_URL
        value: "sqlite:////data/db.sqlite3"
      - key: STATIC_ROOT
        value: "/data/staticfiles"
      - key: ALLOWED_HOSTS
        value: "*"
